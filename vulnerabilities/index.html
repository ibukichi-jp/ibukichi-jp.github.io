<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 読み込み元・接続先を必要なものだけに制限する（レポート内の文字列が細工されていても外部へ接続させない） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/ https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https://github.com https://avatars.githubusercontent.com; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>脆弱性レポート | ibukichi Dashboard</title>
  <meta name="description" content="監視している技術（Node.js / Next.js / TypeScript / Python / Django）の脆弱性情報を、各プロジェクトの公式発表から毎日まとめたレポートです。">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="https://github.com/ibukichi-jp.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root {
      --bg-base: #090d16;
      --bg-card: rgba(18, 24, 38, 0.78);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #38bdf8;
      --radius-md: 14px;
    }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    .page { max-width: 1100px; }
    .page-tag {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 2px; color: var(--accent);
    }
    .page-title { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-weight: 800; }
    .nav-link-sm { font-size: 0.85rem; color: var(--text-muted); text-decoration: none; }
    .nav-link-sm:hover { color: var(--accent); text-decoration: underline; }
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: clamp(16px, 3vw, 28px);
    }
    .report-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .report-item a {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
      padding: 12px 16px; border-radius: 10px; text-decoration: none; color: var(--text-main);
      background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-subtle);
    }
    .report-item a:hover { border-color: rgba(56, 189, 248, 0.4); background: rgba(255, 255, 255, 0.04); }
    .report-date { font-weight: 700; }
    .report-meta { font-size: 0.82rem; color: var(--text-muted); }
    .muted { color: var(--text-muted); }

    /* Markdown 本文 */
    .md h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; }
    .md h2 { font-size: 1.15rem; font-weight: 700; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border-subtle); }
    .md h3 { font-size: 1rem; font-weight: 700; margin: 1.75rem 0 0.5rem; }
    .md p, .md li { line-height: 1.75; color: #e2e8f0; }
    .md a { color: var(--accent); overflow-wrap: anywhere; }
    .md code { color: #f9a8d4; background: rgba(255, 255, 255, 0.06); padding: 0.1em 0.35em; border-radius: 4px; }
    .md blockquote { border-left: 3px solid var(--border-subtle); padding-left: 1rem; color: var(--text-muted); font-size: 0.85rem; }
    .md hr { border-color: var(--border-subtle); opacity: 1; }
    .table-scroll { overflow-x: auto; margin-bottom: 1rem; }
    .md table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .md th, .md td { border: 1px solid var(--border-subtle); padding: 6px 10px; vertical-align: top; }
    .md th { background: rgba(255, 255, 255, 0.04); white-space: nowrap; }
    .md td:nth-child(1), .md td:nth-child(4) { white-space: nowrap; }
    @media (max-width: 767.98px) {
      /* 狭い画面では列を押しつぶさず、表だけ横スクロールさせる */
      .md table { min-width: 900px; }
      .md td:nth-child(5) { min-width: 320px; }
    }
    @media (max-width: 575.98px) {
      .page { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <div class="container page py-4">
    <header class="mb-4">
      <div class="page-tag">VULNERABILITY REPORTS</div>
      <h1 class="page-title h3 mb-2">脆弱性レポート</h1>
      <nav class="d-flex flex-wrap gap-3">
        <a class="nav-link-sm" href="./">レポート一覧</a>
        <a class="nav-link-sm" href="../">ダッシュボードへ戻る</a>
      </nav>
    </header>

    <main class="panel" id="content" aria-live="polite">
      <p class="muted mb-0">読み込み中...</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
  <script src="viewer.js"></script>
</body>
</html>
