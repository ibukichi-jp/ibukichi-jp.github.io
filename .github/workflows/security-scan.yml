name: Security Scan (Syft-Grype)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Setup dependencies
        run: uv sync --frozen --no-dev

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json
          upload-artifact: false

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan SBOM with Grype
        run: |
          echo "=== Grype Vulnerability Scan Report ==="
          grype sbom:sbom.json -o table || true
          grype sbom:sbom.json -o json > grype-results.json

      - name: AI Vulnerability Analysis & Auto-Remediation PR
        env:
          SAKURA_API_KEY: ${{ secrets.SAKURA_API_KEY }}
          DISCORD_URL_GITHUB: ${{ secrets.DISCORD_URL_GITHUB }}
          TOKEN_FOR_WRITE: ${{ secrets.TOKEN_FOR_WRITE }}
          GIT_USER_NAME: "${{ secrets.GIT_USER_NAME }}"
          GIT_EMAIL: "${{ secrets.GIT_EMAIL }}"
        run: |
          git config --global user.name "${GIT_USER_NAME}"
          git config --global user.email "${GIT_EMAIL}"
          uv run ./.src/security_auto_remediate.py