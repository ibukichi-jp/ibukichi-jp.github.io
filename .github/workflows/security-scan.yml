name: Security Scan (Syft-Grype)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 権限はジョブごとに必要な分だけ付ける
permissions: {}

jobs:
  scan:
    name: Scan dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # トークンを .git/config に残さない

      # Syft は uv.lock を直接読めるので、uv や依存パッケージのインストールはしない
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json
          upload-artifact: false

      # 深刻度 High 以上の脆弱性が見つかったら、このステップ（ジョブ）を失敗させる
      # （Medium 以下は実行ログに表示されるだけで、失敗にはしない）
      - name: Scan SBOM with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.json
          fail-build: true
          severity-cutoff: high
          output-format: table # 結果は実行ログに表示される

  notify:
    name: Notify on failure
    needs: scan
    # 失敗したときだけ動く（詳細は実行ログで確認する）
    if: ${{ always() && (needs.scan.result == 'failure' || needs.scan.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Discord and fail the workflow
        env:
          DISCORD_URL_GITHUB: ${{ secrets.DISCORD_URL_GITHUB }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg url "$RUN_URL" \
            '{content: "⚠️ Security Scan が失敗しました（脆弱性が見つかった可能性があります）\n詳細: \($url)", allowed_mentions: {parse: []}}' \
            | curl -fsS --max-time 30 -H "Content-Type: application/json" --data-binary @- "$DISCORD_URL_GITHUB" \
            || echo "Discord への通知に失敗しました"
          exit 1
