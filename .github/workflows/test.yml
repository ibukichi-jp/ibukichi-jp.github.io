name: Test (Unit Tests)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Setup dependencies
        run: uv sync --dev

      - name: Run Pytest Suite
        env:
          SAKURA_API_KEY: "dummy_test_key"
          GITHUB_TOKEN: "dummy_github_token"
        run: uv run pytest -v
