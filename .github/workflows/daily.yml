name: Daily Runner (Tanita & Blog)

on:
  workflow_dispatch:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00)
    - cron: '0 0 * * *'

# 権限はジョブごとに必要な分だけ付ける
permissions: {}

# 手動実行と定期実行が重なって、コミットが衝突しないようにする
concurrency:
  group: daily-runner
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Tanita data and blog posts
    # main 以外のブランチから手動実行しても、main へは書き込まない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 通信が止まったままになっても、既定の 6 時間まで待たない
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # トークンを .git/config に残さない

      # どちらも標準ライブラリだけで動くスクリプトなので、uv や PyPI の依存パッケージは使わない
      # （書き込み権限のあるジョブで、外部のコードを動かさない）
      - name: Sync body composition data
        env:
          TANITA_CLIENT_ID: ${{ secrets.TANITA_CLIENT_ID }}
          TANITA_CLIENT_SECRET: ${{ secrets.TANITA_CLIENT_SECRET }}
          TANITA_REFRESH_TOKEN: ${{ secrets.TANITA_REFRESH_TOKEN }}
        run: python3 -I ./.src/tanita_sync.py

      # タニタの同期に失敗しても、ブログ記事の取得は行う（シークレットは渡さない）
      - name: Fetch latest blog posts
        if: ${{ !cancelled() }}
        run: python3 -I ./.src/blog_feed.py

      # どちらかが失敗しても、成功した方のデータはコミットする
      # （失敗したスクリプトは既存のファイルを書き換えないので、変更が出るのは成功した方だけ）
      - name: Commit and push
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-and-push
        with:
          paths: .data/tanita.json .data/blog.json
          message: Update daily data by CI.
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-email: ${{ secrets.GIT_EMAIL }}
          github-token: ${{ github.token }}

  notify:
    needs: sync
    # 失敗したときだけ動く（どの処理が失敗したかは実行ログで確認する）
    if: ${{ always() && (needs.sync.result == 'failure' || needs.sync.result == 'cancelled') }}
    permissions: {}
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: Daily Runner（日次処理）
    secrets:
      DISCORD_URL_GITHUB: ${{ secrets.DISCORD_URL_GITHUB }}
