name: Daily Runner (Tanita, Haiku)

on:
  workflow_dispatch:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00)
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Setup dependencies
        run: uv sync --frozen --no-dev

      - name: Run Tanita Sync
        id: tanita
        continue-on-error: true
        env:
          TANITA_CLIENT_ID: ${{ secrets.TANITA_CLIENT_ID }}
          TANITA_CLIENT_SECRET: ${{ secrets.TANITA_CLIENT_SECRET }}
          TANITA_REFRESH_TOKEN: ${{ secrets.TANITA_REFRESH_TOKEN }}
        run: |
          uv run ./.src/tanita_sync.py

      - name: Generate Haiku
        id: haiku
        continue-on-error: true
        env:
          SAKURA_API_KEY: ${{ secrets.SAKURA_API_KEY }}
        run: |
          uv run ./.src/haiku_generator.py

      - name: Commit and push daily data
        id: commit_push
        continue-on-error: true
        env:
          GIT_USER_NAME: "${{ secrets.GIT_USER_NAME }}"
          GIT_EMAIL: "${{ secrets.GIT_EMAIL }}"
        run: |
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_EMAIL}"
          git add .data/tanita.json .data/haiku.log
          if git diff --staged --quiet; then
            echo "No changes in daily data. Skipping commit."
          else
            git commit -m "Update daily health & haiku data by CI."
            git push https://x-access-token:${{ secrets.TOKEN_FOR_WRITE }}@github.com/${{ github.actor }}/${{ github.actor }}.github.io.git main
          fi

      - name: Report and Summary
        if: always()
        run: |
          echo "## 📊 Daily Runner 実行サマリー" >> $GITHUB_STEP_SUMMARY
          echo "| 処理名 | ステータス |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏋️ タニタ体組成同期 | ${{ steps.tanita.outcome == 'success' && '✅ 成功' || '❌ 失敗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌸 さくらのAI俳句生成 | ${{ steps.haiku.outcome == 'success' && '✅ 成功' || '❌ 失敗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💾 日次データコミット | ${{ steps.commit_push.outcome == 'success' && '✅ 成功' || '❌ 失敗' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Discord on Failure
        if: always() && (steps.tanita.outcome == 'failure' || steps.haiku.outcome == 'failure' || steps.commit_push.outcome == 'failure')
        env:
          DISCORD_URL_GITHUB: ${{ secrets.DISCORD_URL_GITHUB }}
        run: |
          python3 -c "
          import os, json, urllib.request

          failures = []
          if '${{ steps.tanita.outcome }}' == 'failure': failures.append('🏋️ タニタ体組成同期')
          if '${{ steps.haiku.outcome }}' == 'failure': failures.append('🌸 さくらのAI俳句生成')
          if '${{ steps.commit_push.outcome }}' == 'failure': failures.append('💾 日次データコミット')

          failures_text = '\n'.join([f'- {f}' for f in failures])
          content = f'⚠️ **Daily Runner (日次処理) でエラーが発生しました**\n{failures_text}\n\n詳細ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

          webhook_url = os.environ.get('DISCORD_URL_GITHUB')
          if webhook_url:
              req = urllib.request.Request(
                  webhook_url,
                  data=json.dumps({'username': 'GitHub Actions', 'content': content}).encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'User-Agent': 'GitHub-Actions'}
              )
              urllib.request.urlopen(req)
          "

      - name: Fail workflow if any step failed
        if: always() && (steps.tanita.outcome == 'failure' || steps.haiku.outcome == 'failure' || steps.commit_push.outcome == 'failure')
        run: |
          echo "❌ 1つ以上のステップでエラーが発生したため、ワークフローを失敗（Error）として終了します。"
          exit 1
