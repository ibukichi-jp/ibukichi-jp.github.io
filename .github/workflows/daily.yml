name: Daily Runner (Tanita)

on:
  workflow_dispatch:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00)
    - cron: '0 0 * * *'

# 権限はジョブごとに必要な分だけ付ける
permissions: {}

# 手動実行と定期実行が重なって、コミットが衝突しないようにする
concurrency:
  group: daily-runner
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Tanita data
    # main 以外のブランチから手動実行しても、main へは書き込まない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # トークンを .git/config に残さない

      # 標準ライブラリだけで動くスクリプトなので、uv や PyPI の依存パッケージは使わない
      # （書き込み権限のあるジョブで、外部のコードを動かさない）
      - name: Sync body composition data
        env:
          TANITA_CLIENT_ID: ${{ secrets.TANITA_CLIENT_ID }}
          TANITA_CLIENT_SECRET: ${{ secrets.TANITA_CLIENT_SECRET }}
          TANITA_REFRESH_TOKEN: ${{ secrets.TANITA_REFRESH_TOKEN }}
        run: python3 -I ./.src/tanita_sync.py

      - name: Commit and push
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GH_TOKEN: ${{ github.token }} # gh が実行時に読む。URL・コマンドライン・設定ファイルには書かない
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_EMAIL"
          git add .data/tanita.json
          if git diff --staged --quiet; then
            echo "No changes in daily data. Skipping commit."
            exit 0
          fi
          git commit -m "Update daily health data by CI."
          gh auth setup-git
          git pull --rebase origin main || { git rebase --abort; exit 1; }
          git push origin HEAD:main

  notify:
    name: Notify on failure
    needs: sync
    # 失敗したときだけ動く（詳細は実行ログで確認する）
    if: ${{ always() && (needs.sync.result == 'failure' || needs.sync.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Discord and fail the workflow
        env:
          DISCORD_URL_GITHUB: ${{ secrets.DISCORD_URL_GITHUB }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg url "$RUN_URL" \
            '{content: "⚠️ Daily Runner（日次処理）が失敗しました\n詳細: \($url)", allowed_mentions: {parse: []}}' \
            | curl -fsS --max-time 30 -H "Content-Type: application/json" --data-binary @- "$DISCORD_URL_GITHUB" \
            || echo "Discord への通知に失敗しました"
          exit 1
