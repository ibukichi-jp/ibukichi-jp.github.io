name: Asset Version (Cache Busting)

# CSS / JS が変わったら、index.html の ?v= をファイル内容のハッシュに自動更新する。
# GITHUB_TOKEN による push では push イベントのワークフローが起動しないので、ループしない。
on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "style.css"
      - "js/**"
  workflow_dispatch:

# 権限はジョブごとに必要な分だけ付ける
permissions: {}

concurrency:
  group: asset-version
  cancel-in-progress: false

jobs:
  stamp:
    name: Stamp asset versions
    # main 以外のブランチから手動実行しても、main へは書き込まない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # トークンを .git/config に残さない

      # 標準ライブラリだけで動くスクリプト
      - name: Update asset versions
        run: python3 -I ./.src/update_asset_versions.py index.html

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          paths: index.html
          message: Update asset versions by CI.
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-email: ${{ secrets.GIT_EMAIL }}
          github-token: ${{ github.token }}

  notify:
    needs: stamp
    if: ${{ always() && (needs.stamp.result == 'failure' || needs.stamp.result == 'cancelled') }}
    permissions: {}
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: Asset Version（アセットのバージョン更新）
    secrets:
      DISCORD_URL_GITHUB: ${{ secrets.DISCORD_URL_GITHUB }}
