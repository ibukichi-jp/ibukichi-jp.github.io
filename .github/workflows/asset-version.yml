name: Asset Version (Cache Busting)

# CSS / JS が変わったら、index.html の ?v= をファイル内容のハッシュに自動更新する。
# 自分の更新コミットで再実行されても、ハッシュが同じなら何もしないのでループしない。
on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "style.css"
      - "js/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-version
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Update asset versions
        run: python3 ./.src/update_asset_versions.py index.html

      - name: Commit and push
        env:
          GIT_USER_NAME: "${{ secrets.GIT_USER_NAME }}"
          GIT_EMAIL: "${{ secrets.GIT_EMAIL }}"
        run: |
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_EMAIL}"
          git add index.html
          if git diff --staged --quiet; then
            echo "Asset versions are up to date. Skipping commit."
          else
            git commit -m "Update asset versions by CI."
            git pull --rebase origin main
            git push https://x-access-token:${{ secrets.TOKEN_FOR_WRITE }}@github.com/${{ github.repository }}.git main
          fi
