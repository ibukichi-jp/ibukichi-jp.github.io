name: Hourly Runner (RSS & Notifications)

on:
  workflow_dispatch:
  schedule:
    # 毎時0分 (UTC)
    - cron: '0 * * * *'

# 権限はジョブごとに必要な分だけ付ける
permissions: {}

# 手動実行と定期実行が重なって、コミットが衝突しないようにする
concurrency:
  group: hourly-runner
  cancel-in-progress: false

jobs:
  run:
    name: Update RSS and notifications
    # main 以外のブランチから手動実行しても、main へは書き込まない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # トークンを .git/config に残さない

      # 標準ライブラリだけで動くスクリプトなので、uv や PyPI の依存パッケージは使わない
      # （書き込み権限のあるジョブで、外部のコードを動かさない）
      - name: Generate RSS feed
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: python3 -I ./.src/rss_github_notifications.py

      - name: Commit and push RSS feed
        uses: ./.github/actions/commit-and-push
        with:
          paths: rss/github_notifications.atom
          message: Update RSS files by CI.
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-email: ${{ secrets.GIT_EMAIL }}
          github-token: ${{ github.token }}

      # RSS の生成や push に失敗しても、通知の既読化は行う
      - name: Mark CI notifications as read
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: python3 -I ./.src/change_github_notifications_to_read.py

  notify:
    needs: run
    # 失敗したときだけ動く（どの処理が失敗したかは実行ログで確認する）
    if: ${{ always() && (needs.run.result == 'failure' || needs.run.result == 'cancelled') }}
    permissions: {}
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: Hourly Runner（毎時処理）
    secrets:
      DISCORD_URL_GITHUB: ${{ secrets.DISCORD_URL_GITHUB }}
