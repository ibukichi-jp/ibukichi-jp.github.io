name: Hourly Runner (RSS & Notifications)

on:
  workflow_dispatch:
  schedule:
    # 毎時0分 (UTC)
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  hourly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Setup dependencies
        run: uv sync --frozen --no-dev

      - name: Generate RSS files
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          uv run ./.src/rss_github_notifications.py

      - name: Commit and push RSS files
        env:
          GIT_USER_NAME: "${{ secrets.GIT_USER_NAME }}"
          GIT_EMAIL: "${{ secrets.GIT_EMAIL }}"
        run: |
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_EMAIL}"
          git add ./rss/*.atom
          git commit -m "Update RSS files by CI." || { echo "No changes to commit"; exit 0; }
          git push https://x-access-token:${{ secrets.TOKEN_FOR_WRITE }}@github.com/${{ github.actor }}/${{ github.actor }}.github.io.git main

      - name: Mark GitHub notifications as read
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          uv run ./.src/change_github_notifications_to_read.py
