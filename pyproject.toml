[project]
name = "github-notification-api"
version = "0.1.0"
description = "Personal dashboard and automated CI workflows for ibukichi-jp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "atproto>=0.0.72",
    "feedgen>=1.0.0",
    "jpholiday>=1.0.3",
    "openai>=3.33.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (Python 3.12+ modern syntax)
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]
